<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quán Ăn – Tra Cứu Đơn Hàng</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="index.html"><span class="logo-icon">🍜</span> Quán Ngon</a>
    <ul class="navbar-links">
        <li><a href="index.html">Thực đơn</a></li>
        <li><a href="cart.html">Giỏ hàng</a></li>
        <li><a href="product.html" class="active">Tra cứu đơn</a></li>
    </ul>
    <div class="navbar-right">
        <a href="cart.html" class="cart-btn">🛒 <span class="cart-count">0</span></a>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <h1>🔍 Tra Cứu Đơn Hàng</h1>
        <p>Kiểm tra trạng thái đơn hàng của bạn</p>
    </div>
</div>

<div class="container" style="padding-top:2rem; padding-bottom:3rem; max-width:820px;">

    <!-- SEARCH BY ID -->
    <div style="background:var(--card-bg); border-radius:var(--radius); border:1px solid var(--border); padding:1.6rem; box-shadow:var(--shadow); margin-bottom:1.5rem;">
        <h2 class="section-title" style="margin-bottom:1rem;">🔎 Tìm theo mã đơn</h2>
        <div style="display:flex; gap:.7rem;">
            <input class="form-control" type="number" id="orderIdInput" placeholder="Nhập mã đơn hàng (VD: 1)" style="border-radius:50px;" />
            <button class="btn btn-primary" onclick="searchOrder()">Tìm kiếm</button>
        </div>
        <div id="orderResult" style="margin-top:1rem;"></div>
    </div>

    <!-- ALL ORDERS TABLE -->
    <div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
            <h2 class="section-title" style="margin:0;">📦 Tất cả đơn hàng</h2>
            <button class="btn btn-outline btn-sm" onclick="loadAllOrders()">🔄 Làm mới</button>
        </div>
        <div id="allOrdersWrap" class="table-wrap">
            <div class="loader"><div class="spinner"></div>Đang tải...</div>
        </div>
    </div>
</div>

<div class="toast-container"></div>
<script src="../js/main.js"></script>
<script>
    async function searchOrder() {
      const id = document.getElementById('orderIdInput').value.trim();
      if (!id) { toast('Nhập mã đơn hàng', 'warning'); return; }
      const result = document.getElementById('orderResult');
      result.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
      try {
        const order = await api.get(`/donhang/${id}`);
        result.innerHTML = renderOrderCard(order);
      } catch {
        result.innerHTML = `<div style="color:var(--danger); padding:.5rem;">❌ Không tìm thấy đơn hàng #${id}</div>`;
      }
    }

    function renderOrderCard(order) {
      return `
        <div style="background:var(--bg); border-radius:var(--radius-sm); padding:1rem; border:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.8rem;">
            <strong style="font-family:'Playfair Display',serif; font-size:1.1rem;">Đơn #${order.donHangID}</strong>
            ${statusBadge(order.trangThai || 'PENDING')}
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:.5rem; font-size:.87rem; color:var(--text-muted);">
            <span>📅 Ngày đặt:</span><span style="color:var(--text);">${fmtDate(order.ngayDat)}</span>
            <span>💰 Tổng tiền:</span><span style="color:var(--primary); font-weight:700;">${fmt(order.tongTien || 0)}</span>
            <span>👤 Khách hàng:</span><span style="color:var(--text);">${order.khachHang?.tenKhachHang || '—'}</span>
            <span>🧑‍🍳 Nhân viên:</span><span style="color:var(--text);">${order.nhanVien?.tenNhanVien || '—'}</span>
          </div>
        </div>`;
    }

    async function loadAllOrders() {
      const wrap = document.getElementById('allOrdersWrap');
      wrap.innerHTML = '<div class="loader"><div class="spinner"></div>Đang tải...</div>';
      try {
        const orders = await api.get('/donhang');
        if (!orders.length) { wrap.innerHTML = '<div class="loader">Chưa có đơn hàng nào.</div>'; return; }
        wrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Ngày đặt</th>
                <th>Khách hàng</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody>
              ${orders.map(o => `
                <tr>
                  <td><strong>#${o.donHangID}</strong></td>
                  <td>${fmtDate(o.ngayDat)}</td>
                  <td>${o.khachHang?.tenKhachHang || '—'}</td>
                  <td style="font-weight:700; color:var(--primary);">${fmt(o.tongTien || 0)}</td>
                  <td>${statusBadge(o.trangThai || 'PENDING')}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } catch {
        wrap.innerHTML = '<div class="loader">⚠️ Không thể kết nối server. Đảm bảo Spring Boot đang chạy tại <b>localhost:8080</b>.</div>';
      }
    }

    document.getElementById('orderIdInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchOrder(); });
    document.addEventListener('DOMContentLoaded', loadAllOrders);
</script>
</body>
</html>

# =============================================
# SQL SERVER
# =============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QUANLI_APPODER_DOAN;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=111111qqq
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# T?t t? ??ng chuy?n tên c?t sang snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# =============================================
# SERVER
# =============================================
server.port=8080
spring.application.name=sbquanan

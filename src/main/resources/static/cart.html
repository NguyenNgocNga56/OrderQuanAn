<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng – QuanAn67</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/khachhang.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <div class="header-inner">
        <a href="/khachhang.html" class="logo">
            <span class="logo-icon"></span>
            <span class="logo-text">QuanAn<strong>Pro</strong></span>
        </a>
        <nav class="nav">
            <a href="/khachhang.html"> Trang chủ</a>
            <a href="/khachhang.html#menu-section"> Thực đơn</a>
            <a href="/cart.html" class="nav-active"> Giỏ hàng</a>
        </nav>
    </div>
</header>

<div style="padding-top:64px; max-width:1100px; margin:0 auto; padding-left:24px; padding-right:24px; padding-bottom:60px;">

    <h1 style="font-family:'Playfair Display',serif; font-size:2rem; margin:40px 0 8px;"> Giỏ hàng của bạn</h1>
    <p style="color:var(--text-muted); margin-bottom:32px;">Kiểm tra lại đơn hàng trước khi đặt món</p>

    <div class="cart-page-grid">

        <!-- DANH SÁCH MÓN -->
        <div class="cart-page-items" id="cartPageItems">
            <div class="km-loading">Đang tải...</div>
        </div>

        <!-- THÔNG TIN ĐẶT HÀNG -->
        <div class="cart-page-info">
            <div class="info-card">
                <h3 style="font-family:'Playfair Display',serif; margin-bottom:20px;"> Thông tin đặt hàng</h3>

                <div class="form-group">
                    <label>Khách hàng</label>
                    <select class="kh-select" id="selKhachHang">
                        <option value="">-- Khách vãng lai --</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label>Nhân viên phục vụ</label>
                    <select class="kh-select" id="selNhanVien">
                        <option value="">-- Chọn nhân viên --</option>
                    </select>
                </div>

                <hr style="border-color:var(--border); margin:20px 0;">

                <div class="summary-row"><span>Số món:</span><span id="sumMon">0</span></div>
                <div class="summary-row"><span>Tạm tính:</span><span id="sumTam">0 đ</span></div>
                <div class="summary-row summary-total"><span>Tổng cộng:</span><span id="sumTotal">0 đ</span></div>

                <button class="btn-primary" style="width:100%;margin-top:20px;font-size:1rem;padding:15px;" onclick="datMon()">
                     Đặt món ngay
                </button>
                <a href="/khachhang.html#menu-section" class="btn-ghost" style="display:block;text-align:center;margin-top:10px;padding:12px;">
                    ← Thêm món
                </a>
            </div>
        </div>
    </div>
</div>

<!-- MODAL ĐẶT THÀNH CÔNG -->
<div class="modal-overlay" id="successModal" onclick="closeModalOut(event,'successModal')">
    <div class="modal-box" style="max-width:560px;">
        <button class="modal-close" onclick="closeModal('successModal')">✕</button>
        <div class="modal-header">
            <div class="modal-icon"></div>
            <h2>Đặt hàng thành công!</h2>
        </div>
        <div id="successBody"></div>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <a href="/khachhang.html" class="btn-ghost" style="flex:1;text-align:center;padding:12px;text-decoration:none;"> Về trang chủ</a>
            <button class="btn-primary" style="flex:1;" onclick="closeModal('successModal')">Đặt thêm</button>
        </div>
    </div>
</div>

<script src="/js/khachhang.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
